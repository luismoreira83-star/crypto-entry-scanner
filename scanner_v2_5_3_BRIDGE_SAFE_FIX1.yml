name: Crypto Entry Scanner

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "External 15m scheduler"
        required: false
        default: "false"
      test_auto_bridge:
        description: "Testar ligacao GitHub -> Auto Trader"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: crypto-entry-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Restore scanner state
        uses: actions/cache@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-

      - name: Scan Top 200
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_TRADER_URL: ${{ secrets.AUTO_TRADER_URL }}
          AUTO_TRADER_WEBHOOK_SECRET: ${{ secrets.AUTO_TRADER_WEBHOOK_SECRET }}
          AUTO_BRIDGE_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_auto_bridge == 'true' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scheduled != 'true' }}
        run: |
          python - <<'PY'
          import os, time, json, requests, hashlib, hmac
          import pandas as pd
          import numpy as np
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TOKEN = os.getenv("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.getenv("TELEGRAM_CHAT_ID", "")
          AUTO_TRADER_URL = os.getenv("AUTO_TRADER_URL", "").rstrip("/")
          AUTO_TRADER_WEBHOOK_SECRET = os.getenv(
              "AUTO_TRADER_WEBHOOK_SECRET", ""
          )
          AUTO_BRIDGE_TEST = (
              os.getenv("AUTO_BRIDGE_TEST", "false").lower()
              == "true"
          )
          MANUAL = os.getenv("MANUAL_RUN", "false").lower() == "true"

          # Simbolos gerados em runtime: o ficheiro continua 100% ASCII.
          GREEN = chr(0x1F7E2)
          YELLOW = chr(0x1F7E1)
          RED = chr(0x1F534)
          CHECK = chr(0x2705)
          WARNING = chr(0x26A0) + chr(0xFE0F)
          TEST = chr(0x1F9EA)
          CHART = chr(0x1F4CA)

          TOP_N = 200
          MIN_VOLUME = 5_000_000
          STRATEGY_VERSION = "2.5"
          OPERATION_MODE = "REAL_PILOT"
          OPERATION_VERSION = "2.5.3-BRIDGE"

          # Protecoes adicionais para o piloto real.
          PILOT_MAX_OPEN = 2
          PILOT_MAX_CONSEC_STOPS = 5
          PILOT_MAX_CUM_LOSS_R = -5.0
          MAX_SPREAD_PCT = 0.20
          MIN_LIVE_RR_TP1 = 1.30

          # Stablecoins excluidas desta estrategia de momentum.
          STABLECOINS = {
              "USDC", "FDUSD", "DAI", "TUSD", "USDP", "PYUSD",
              "EURC", "USDE", "USDS", "GUSD", "LUSD", "FRAX",
              "RLUSD", "USD1", "USDG", "EURI", "EURS"
          }
          BINANCE = "https://data-api.binance.vision"
          COINGECKO = "https://api.coingecko.com/api/v3"
          STATE_FILE = "scanner_state.json"

          ALERT_COOLDOWN = 3 * 60 * 60
          POST_STOP_COOLDOWN = 12 * 60 * 60
          DOUBLE_STOP_WINDOW = 48 * 60 * 60
          DOUBLE_STOP_COOLDOWN = 24 * 60 * 60
          STATE_RESET_SAFETY = 24 * 60 * 60

          RECOVERY_CANDLES_15M = 4
          MAX_LATE_EXTENSION_ATR = 0.60

          # Filtro macro BTC: so bloqueia novas entradas
          # quando ha deterioracao clara em 1H + 15m.
          BTC_RISK_OFF_SCORE = 5
          BTC_CAUTION_SCORE = 3

          # Retencao de forca para sinais recuperados (15-60 min).
          # Nao altera sinais frescos da vela 15m mais recente.
          STRENGTH_MIN_RSI15 = 50
          STRENGTH_MAX_DROP_ATR = 0.20
          STRENGTH_BEAR_BODY_ATR = 0.40
          STRENGTH_BEAR_VOL_RATIO = 1.05
          STRENGTH_MIN_CURRENT_VOLUME = 0.80
          STRENGTH_MIN_FOLLOW_ATR = 0.10
          STRENGTH_MAX_3BAR_DROP_ATR = 0.10
          BREAKOUT_LOOKBACK_15M = 12
          BREAKOUT_NEAR_ATR = 0.12
          BREAKOUT_MIN_VOLUME = 1.10

          s = requests.Session()
          s.headers.update({"User-Agent": "crypto-entry-scanner/2.5.3-bridge"})

          def load_state():
              reset_detected = False
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      x = json.load(f)
                  if not isinstance(x, dict):
                      raise ValueError
              except Exception:
                  x = {}
                  reset_detected = True

              x.setdefault("alerts", {})
              x.setdefault("trades", [])
              x.setdefault("state_health", {})

              if reset_detected:
                  now_ts = int(time.time())
                  x["state_health"] = {
                      "reset_detected_at": now_ts,
                      "safe_until": now_ts + STATE_RESET_SAFETY,
                      "warning_sent": False
                  }

              return x, reset_detected

          STATE, STATE_RESET_DETECTED = load_state()

          def save_state():
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(STATE, f, ensure_ascii=False, indent=2)

          def telegram(text):
              if not TOKEN or not CHAT_ID:
                  print("Telegram secrets not configured")
                  return False
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                      json={"chat_id": CHAT_ID, "text": text},
                      timeout=15
                  )
                  print("Telegram:", r.status_code)
                  return r.status_code == 200
              except Exception as e:
                  print("Telegram error:", e)
                  return False

          def send_auto_signal(r, now_ts):
              if (
                  not AUTO_TRADER_URL
                  or not AUTO_TRADER_WEBHOOK_SECRET
              ):
                  print("AUTO TRADER: secrets not configured")
                  return False

              try:
                  confirmation_ts = int(
                      r.get("confirmation_close_time", 0) or 0
                  )
                  signal_identity = (
                      f"{r['symbol']}:"
                      f"{confirmation_ts}:"
                      f"{STRATEGY_VERSION}"
                  )
                  signal_id = hashlib.sha256(
                      signal_identity.encode()
                  ).hexdigest()[:24]

                  payload = {
                      "signal_id": signal_id,
                      "symbol": r["symbol"],
                      "created_at": int(now_ts),
                      "entry_low": float(r["entry_low"]),
                      "entry_high": float(r["entry_high"]),
                      "stop": float(r["stop"]),
                      "tp1": float(r["tp1"]),
                      "score": int(r["score"]),
                      "strategy_version": STRATEGY_VERSION,
                      "source": "github-scanner"
                  }

                  body = json.dumps(
                      payload,
                      separators=(",", ":")
                  ).encode()

                  ts = str(int(time.time()))
                  signature = hmac.new(
                      AUTO_TRADER_WEBHOOK_SECRET.encode(),
                      ts.encode() + b"." + body,
                      hashlib.sha256
                  ).hexdigest()

                  resp = requests.post(
                      AUTO_TRADER_URL + "/signal",
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "X-Signal-Timestamp": ts,
                          "X-Signal-Signature": signature
                      },
                      timeout=6
                  )

                  print(
                      "AUTO TRADER:",
                      resp.status_code,
                      resp.text[:300]
                  )
                  return resp.ok

              except Exception as e:
                  print("AUTO TRADER DELIVERY ERROR:", e)
                  return False

          if AUTO_BRIDGE_TEST:
              try:
                  q = requests.get(
                      f"{BINANCE}/api/v3/ticker/bookTicker",
                      params={"symbol": "BTCUSDT"},
                      timeout=10
                  )
                  q.raise_for_status()
                  ask = float(q.json()["askPrice"])

                  test_r = {
                      "symbol": "BTCUSDT",
                      "entry_low": ask * 0.999,
                      "entry_high": ask * 1.001,
                      "stop": ask * 0.99,
                      "tp1": ask * 1.015,
                      "score": 100,
                      "confirmation_close_time": int(time.time())
                  }

                  ok = send_auto_signal(
                      test_r,
                      int(time.time())
                  )
                  print(
                      "AUTO BRIDGE TEST:",
                      "DELIVERED" if ok else "FAILED"
                  )
                  raise SystemExit(
                      0 if ok else 2
                  )

              except SystemExit:
                  raise
              except Exception as e:
                  print("AUTO BRIDGE TEST ERROR:", e)
                  raise SystemExit(2)

          def current_quote(symbol):
              r = s.get(
                  f"{BINANCE}/api/v3/ticker/bookTicker",
                  params={"symbol": symbol},
                  timeout=10
              )
              r.raise_for_status()
              q = r.json()
              bid = float(q["bidPrice"])
              ask = float(q["askPrice"])
              mid = (bid + ask) / 2.0
              spread_pct = (
                  (ask - bid) / max(mid, 1e-12)
              ) * 100
              return {
                  "bid": bid,
                  "ask": ask,
                  "mid": mid,
                  "spread_pct": spread_pct
              }

          def pilot_status():
              trades = [
                  t for t in STATE["trades"]
                  if t.get("mode") == OPERATION_MODE
              ]
              closed = [
                  t for t in trades
                  if t.get("status") == "CLOSED"
              ]
              opened = [
                  t for t in trades
                  if t.get("status") == "OPEN"
              ]

              closed.sort(
                  key=lambda t: int(
                      t.get("closed_at", 0) or 0
                  )
              )

              net_r = sum(
                  float(t.get("pnl_r", 0) or 0)
                  for t in closed
              )

              consecutive_stops = 0
              for t in reversed(closed):
                  if t.get("outcome") == "STOP":
                      consecutive_stops += 1
                  else:
                      break

              halted = (
                  net_r <= PILOT_MAX_CUM_LOSS_R
                  or consecutive_stops >=
                  PILOT_MAX_CONSEC_STOPS
              )

              return {
                  "closed": closed,
                  "opened": opened,
                  "net_r": net_r,
                  "consecutive_stops":
                      consecutive_stops,
                  "halted": halted
              }

          state_health = STATE.setdefault("state_health", {})
          state_safe_until = int(
              state_health.get("safe_until", 0) or 0
          )
          STATE_SAFE_MODE = (
              int(time.time()) < state_safe_until
          )

          if (
              STATE_RESET_DETECTED
              and not state_health.get("warning_sent", False)
          ):
              remaining_h = max(
                  1,
                  int(
                      (
                          state_safe_until - int(time.time())
                      ) / 3600
                  )
              )
              telegram(
                  f"{WARNING} STATE RESET DETETADO\n\n"
                  f"O ficheiro de estado nao foi restaurado ou estava invalido.\n"
                  f"Alertas operacionais suspensos por cerca de {remaining_h}h.\n"
                  f"O scanner continua a analisar em modo de observacao."
              )
              state_health["warning_sent"] = True
              save_state()

          def ema(x, n):
              return x.ewm(span=n, adjust=False).mean()

          def rsi(x, n=14):
              d = x.diff()
              g = d.clip(lower=0)
              l = -d.clip(upper=0)
              ag = g.ewm(alpha=1/n, adjust=False, min_periods=n).mean()
              al = l.ewm(alpha=1/n, adjust=False, min_periods=n).mean()
              rs = ag / al.replace(0, np.nan)
              return (100 - 100/(1 + rs)).fillna(50)

          def atr(df, n=14):
              prev = df["close"].shift(1)
              tr = pd.concat([
                  df["high"] - df["low"],
                  (df["high"] - prev).abs(),
                  (df["low"] - prev).abs()
              ], axis=1).max(axis=1)
              return tr.ewm(alpha=1/n, adjust=False).mean().bfill()

          def klines(symbol, interval, limit=180):
              r = s.get(
                  f"{BINANCE}/api/v3/klines",
                  params={"symbol": symbol, "interval": interval, "limit": limit},
                  timeout=15
              )
              r.raise_for_status()
              cols = [
                  "open_time","open","high","low","close","volume",
                  "close_time","quote_volume","trades","buy_base",
                  "buy_quote","ignore"
              ]
              df = pd.DataFrame(r.json(), columns=cols)
              for c in ["open","high","low","close","volume","quote_volume","open_time","close_time"]:
                  df[c] = pd.to_numeric(df[c], errors="coerce")

              # So velas fechadas.
              if len(df) > 1:
                  df = df.iloc[:-1].copy()

              df["ema20"] = ema(df["close"], 20)
              df["ema50"] = ema(df["close"], 50)
              df["rsi"] = rsi(df["close"])
              df["atr"] = atr(df)
              df["vol_ma20"] = df["volume"].rolling(20, min_periods=5).mean()
              df["vol_ratio"] = (
                  df["volume"] / df["vol_ma20"].replace(0, np.nan)
              ).fillna(1)
              return df

          def btc_market_regime():
              try:
                  h1 = klines("BTCUSDT", "1h")
                  m15 = klines("BTCUSDT", "15m")

                  if len(h1) < 60 or len(m15) < 60:
                      return {
                          "status": "UNKNOWN",
                          "risk_off": False,
                          "caution": False,
                          "score": 0,
                          "flags": {}
                      }

                  H = h1.iloc[-1]
                  M = m15.iloc[-1]

                  red_15m = M["close"] < M["open"]
                  body_15m = abs(
                      float(M["close"]) -
                      float(M["open"])
                  )

                  flags = {
                      "h1_below_ema20":
                          H["close"] < H["ema20"],
                      "h1_ema20_falling":
                          h1["ema20"].iloc[-1] <
                          h1["ema20"].iloc[-4],
                      "m15_below_ema20":
                          M["close"] < M["ema20"],
                      "m15_structure_down":
                          M["close"] <
                          m15["close"].iloc[-4],
                      "m15_sell_volume":
                          red_15m and
                          M["vol_ratio"] >= 1.25,
                      "m15_bear_impulse":
                          red_15m and
                          body_15m >=
                          0.60 * float(M["atr"])
                  }

                  score = sum(
                      1 for value in flags.values()
                      if value
                  )

                  severe_15m = all([
                      flags["m15_below_ema20"],
                      flags["m15_structure_down"],
                      flags["m15_sell_volume"],
                      flags["m15_bear_impulse"]
                  ])

                  risk_off = (
                      score >= BTC_RISK_OFF_SCORE
                      or severe_15m
                  )

                  caution = (
                      not risk_off
                      and score >= BTC_CAUTION_SCORE
                  )

                  status = (
                      "RISK-OFF"
                      if risk_off
                      else (
                          "CAUTELA"
                          if caution
                          else "NORMAL"
                      )
                  )

                  return {
                      "status": status,
                      "risk_off": risk_off,
                      "caution": caution,
                      "score": score,
                      "flags": flags,
                      "price": float(M["close"]),
                      "rsi15": float(M["rsi"]),
                      "vol15": float(M["vol_ratio"])
                  }

              except Exception as e:
                  print(
                      "BTC regime error:",
                      e
                  )

                  return {
                      "status": "UNKNOWN",
                      "risk_off": False,
                      "caution": False,
                      "score": 0,
                      "flags": {}
                  }

          def update_paper():
              closed_now = []
              for t in STATE["trades"]:
                  if t.get("status") != "OPEN":
                      continue
                  try:
                      df = klines(t["symbol"], "15m", 100)
                      last_checked = int(t.get("last_checked", t.get("opened_at", 0)))

                      for _, c in df.iterrows():
                          close_time = int(c["close_time"] / 1000)
                          if close_time <= last_checked:
                              continue

                          t["last_checked"] = close_time
                          low = float(c["low"])
                          high = float(c["high"])
                          stop = float(t["stop"])
                          tp1 = float(t["tp1"])
                          entry = float(t["entry"])

                          if low <= stop:
                              t.update({
                                  "status":"CLOSED","outcome":"STOP","exit":stop,
                                  "pnl_r":-1.0,"closed_at":close_time
                              })
                              closed_now.append(t.copy())
                              print("PAPER CLOSED:", t["symbol"], "STOP", "-1.00R")
                              break

                          if high >= tp1:
                              risk = max(entry - stop, 1e-12)
                              pnl_r = (tp1 - entry) / risk
                              t.update({
                                  "status":"CLOSED","outcome":"TP1","exit":tp1,
                                  "pnl_r":pnl_r,"closed_at":close_time
                              })
                              closed_now.append(t.copy())
                              print("PAPER CLOSED:", t["symbol"], "TP1", f"{pnl_r:.2f}R")
                              break

                  except Exception as e:
                      print("Paper update error", t.get("symbol"), e)
              return closed_now

          def stop_block(symbol, now_ts):
              stops = [
                  t for t in STATE["trades"]
                  if (
                      t.get("symbol") == symbol
                      and t.get("status") == "CLOSED"
                      and t.get("outcome") == "STOP"
                      and t.get("closed_at")
                  )
              ]
              if not stops:
                  return False, ""

              stops.sort(key=lambda t: int(t.get("closed_at", 0)), reverse=True)
              last_stop = int(stops[0].get("closed_at", 0))
              age = now_ts - last_stop
              recent_48h = [
                  t for t in stops
                  if now_ts - int(t.get("closed_at", 0)) <= DOUBLE_STOP_WINDOW
              ]

              if len(recent_48h) >= 2 and age < DOUBLE_STOP_COOLDOWN:
                  return True, "2 stops recentes / bloqueio 24h"
              if age < POST_STOP_COOLDOWN:
                  return True, "cooldown 12h apos stop"
              return False, ""

          def bullish_ob(df):
              if len(df) < 40:
                  return None
              a = float(df["atr"].iloc[-1])

              for i in range(len(df)-5, max(5, len(df)-45), -1):
                  c = df.iloc[i]
                  if c["close"] >= c["open"]:
                      continue

                  high = max(c["open"], c["close"])
                  low = c["low"]
                  future = df.iloc[i+1:min(i+4, len(df))]

                  if len(future) == 0:
                      continue
                  if future["high"].max() < high + 0.80*a:
                      continue
                  if future["close"].max() <= high:
                      continue

                  return {"low": float(low), "high": float(high)}
              return None

          def recent_confirmation(m15, ob_low, ob_high):
              last_idx = len(m15) - 1
              start_idx = max(3, last_idx - RECOVERY_CANDLES_15M + 1)

              for idx in range(last_idx, start_idx - 1, -1):
                  C = m15.iloc[idx]
                  recent = m15.iloc[max(0, idx-5):idx+1]

                  touched = recent["low"].min() <= ob_high * 1.003
                  ob_valid = recent["close"].min() > ob_low * 0.985
                  reclaim = C["close"] > ob_high and C["close"] > C["open"]
                  volume_ok = C["vol_ratio"] >= 1.15
                  rsi_ok = 45 <= C["rsi"] <= 70
                  structure = C["close"] > m15.iloc[idx-3]["close"]

                  if all([touched, ob_valid, reclaim, volume_ok, rsi_ok, structure]):
                      return {
                          "age_candles": last_idx - idx,
                          "close": float(C["close"]),
                          "high": float(C["high"]),
                          "close_time": int(C["close_time"] / 1000),
                          "rsi": float(C["rsi"]),
                          "volume_ratio": float(C["vol_ratio"])
                      }
              return None

          def analyze(symbol, volume24, rank):
              try:
                  h1 = klines(symbol, "1h")
                  m15 = klines(symbol, "15m")
                  if len(h1) < 60 or len(m15) < 60:
                      return None

                  H = h1.iloc[-1]
                  M = m15.iloc[-1]
                  price = float(M["close"])

                  trend = H["close"] > H["ema20"] > H["ema50"]
                  ema_rising = h1["ema20"].iloc[-1] > h1["ema20"].iloc[-4]

                  ob = bullish_ob(h1)
                  if not ob:
                      return {"symbol":symbol, "status":"AGUARDAR", "score":0, "rank":rank}

                  ob_low = ob["low"]
                  ob_high = ob["high"]
                  current_recent = m15.iloc[-6:]
                  ob_valid_now = current_recent["close"].min() > ob_low * 0.985

                  confirm = recent_confirmation(m15, ob_low, ob_high)
                  a15 = float(M["atr"])
                  not_extended = price <= H["ema20"] + 1.60 * H["atr"]
                  current_above_ob = price > ob_high
                  late_not_chased = bool(
                      confirm and
                      price <= confirm["close"] +
                      MAX_LATE_EXTENSION_ATR * a15
                  )

                  signal_age = (
                      int(confirm["age_candles"])
                      if confirm
                      else 999
                  )

                  current_rsi = float(M["rsi"])
                  current_volume_ratio = float(
                      M["vol_ratio"]
                  )
                  current_above_ema20 = (
                      price >= float(M["ema20"])
                  )

                  current_not_faded = bool(
                      confirm and
                      price >=
                      confirm["close"] -
                      STRENGTH_MAX_DROP_ATR * a15
                  )

                  current_bear_body = abs(
                      float(M["close"]) -
                      float(M["open"])
                  )

                  current_bear_impulse = (
                      M["close"] < M["open"]
                      and current_bear_body >=
                      STRENGTH_BEAR_BODY_ATR * a15
                      and current_volume_ratio >=
                      STRENGTH_BEAR_VOL_RATIO
                  )

                  current_volume_ok = (
                      current_volume_ratio >=
                      STRENGTH_MIN_CURRENT_VOLUME
                  )

                  recent_3bar_ok = (
                      price >=
                      float(m15["close"].iloc[-3]) -
                      STRENGTH_MAX_3BAR_DROP_ATR * a15
                  )

                  follow_through = False
                  breakout_volume_ok = True

                  if confirm and signal_age in (1, 2, 3):
                      confirm_idx = (
                          len(m15) - 1 - signal_age
                      )
                      after_confirm = m15.iloc[
                          confirm_idx + 1:
                      ]

                      if len(after_confirm):
                          follow_through = (
                              float(
                                  after_confirm["high"].max()
                              ) >=
                              confirm["high"] +
                              STRENGTH_MIN_FOLLOW_ATR *
                              a15
                          )

                      lookback_start = max(
                          0,
                          len(m15) -
                          BREAKOUT_LOOKBACK_15M - 1
                      )
                      prev_high = float(
                          m15["high"].iloc[
                              lookback_start:-1
                          ].max()
                      )

                      near_breakout = (
                          price >=
                          prev_high -
                          BREAKOUT_NEAR_ATR * a15
                      )

                      breakout_volume_ok = (
                          not near_breakout
                          or current_volume_ratio >=
                          BREAKOUT_MIN_VOLUME
                      )

                  if signal_age == 0:
                      strength_retained = True
                  elif signal_age in (1, 2, 3):
                      strength_retained = all([
                          current_above_ema20,
                          current_rsi >=
                          STRENGTH_MIN_RSI15,
                          current_not_faded,
                          current_volume_ok,
                          recent_3bar_ok,
                          follow_through,
                          breakout_volume_ok,
                          not current_bear_impulse
                      ])
                  else:
                      strength_retained = False

                  score = (
                      20*trend +
                      10*ema_rising +
                      15*ob_valid_now +
                      50*bool(confirm) +
                      5*not_extended
                  )

                  enter = all([
                      trend,
                      ema_rising,
                      ob_valid_now,
                      bool(confirm),
                      current_above_ob,
                      late_not_chased,
                      strength_retained,
                      not_extended
                  ])

                  entry_low = max(ob_high, price - 0.25*a15)
                  entry_high = price + 0.10*a15
                  stop = min(ob_low - 0.10*a15, entry_low - 1.15*a15)
                  risk = max(entry_low - stop, 0.5*a15)

                  return {
                      "symbol":symbol,
                      "rank":rank,
                      "status":"ENTRAR" if enter else "AGUARDAR",
                      "score":int(score),
                      "price":price,
                      "entry_low":entry_low,
                      "entry_high":entry_high,
                      "stop":stop,
                      "tp1":entry_low + 1.5*risk,
                      "tp2":entry_low + 2.2*risk,
                      "tp3":entry_low + 3.0*risk,
                      "rsi":float(confirm["rsi"]) if confirm else float(M["rsi"]),
                      "volume_ratio":(
                          float(confirm["volume_ratio"])
                          if confirm else float(M["vol_ratio"])
                      ),
                      "volume24":volume24,
                      "ob_low":ob_low,
                      "ob_high":ob_high,
                      "signal_age_candles":
                          signal_age,
                      "confirmation_close_time": (
                          int(confirm["close_time"])
                          if confirm else 0
                      ),
                      "strength_retained":
                          bool(strength_retained),
                      "current_rsi":
                          current_rsi,
                      "current_volume_ratio":
                          current_volume_ratio,
                      "current_above_ema20":
                          bool(current_above_ema20),
                      "current_not_faded":
                          bool(current_not_faded),
                      "current_volume_ok":
                          bool(current_volume_ok),
                      "recent_3bar_ok":
                          bool(recent_3bar_ok),
                      "follow_through":
                          bool(follow_through),
                      "breakout_volume_ok":
                          bool(breakout_volume_ok),
                      "current_bear_impulse":
                          bool(current_bear_impulse)
                  }

              except Exception as e:
                  print(symbol, "ERROR:", e)
                  return None

          print("Obtendo Top 200 por market cap...")

          cg = s.get(
              f"{COINGECKO}/coins/markets",
              params={
                  "vs_currency":"usd",
                  "order":"market_cap_desc",
                  "per_page":TOP_N,
                  "page":1,
                  "sparkline":"false"
              },
              timeout=25
          )
          cg.raise_for_status()
          coins = cg.json()

          print("Obtendo pares Binance...")

          ex = s.get(f"{BINANCE}/api/v3/exchangeInfo", timeout=25)
          ex.raise_for_status()
          valid = {
              x["symbol"]
              for x in ex.json()["symbols"]
              if (
                  x["status"] == "TRADING"
                  and x["quoteAsset"] == "USDT"
                  and x.get("isSpotTradingAllowed", True)
              )
          }

          tr = s.get(f"{BINANCE}/api/v3/ticker/24hr", timeout=25)
          tr.raise_for_status()
          volumes = {
              x["symbol"]: float(x.get("quoteVolume", 0) or 0)
              for x in tr.json()
          }

          closed_now = update_paper()

          btc_regime = btc_market_regime()

          print(
              "BTC REGIME:",
              btc_regime["status"],
              f"{btc_regime['score']}/6"
          )

          candidates = []
          for coin in coins:
              base = coin["symbol"].upper()
              if base in STABLECOINS:
                  continue
              pair = base + "USDT"
              if pair not in valid:
                  continue
              vol = volumes.get(pair, 0)
              if vol < MIN_VOLUME:
                  continue
              candidates.append({
                  "symbol":pair,
                  "rank":coin.get("market_cap_rank", 999),
                  "volume":vol
              })

          print(f"{len(candidates)} pares Top-200 elegiveis.")

          results = []
          with ThreadPoolExecutor(max_workers=8) as pool:
              futs = [
                  pool.submit(analyze, x["symbol"], x["volume"], x["rank"])
                  for x in candidates
              ]
              for f in as_completed(futs):
                  r = f.result()
                  if r:
                      results.append(r)

          results.sort(
              key=lambda x: (
                  x.get("status") == "ENTRAR",
                  x.get("score", 0)
              ),
              reverse=True
          )

          btc_blocked = 0
          btc_blocked_symbols = []

          if btc_regime["risk_off"]:
              for x in results:
                  if x.get("status") == "ENTRAR":
                      x["status"] = "AGUARDAR"
                      x["market_blocked"] = True
                      btc_blocked += 1
                      btc_blocked_symbols.append(
                          x["symbol"]
                      )

              if btc_blocked:
                  print(
                      "BTC RISK-OFF BLOCK:",
                      btc_blocked,
                      ",".join(
                          btc_blocked_symbols
                      )
                  )

          enter_signals = [
              x for x in results
              if x.get("status") == "ENTRAR"
          ]

          print(
              "Sinais ENTRAR:",
              len(enter_signals)
          )

          now = int(time.time())
          alerts_sent = 0
          telegram_sent = 0
          auto_delivery_ok = 0
          auto_delivery_fail = 0
          duplicates = 0
          stop_blocks = 0
          live_price_blocks = 0
          spread_blocks = 0
          rr_blocks = 0
          alert_cap_blocks = 0
          open_cap_blocks = 0
          pilot_halt_blocks = 0
          state_safe_blocks = 0
          btc_unknown_blocks = 0
          btc_caution_blocks = 0

          PILOT = pilot_status()

          if btc_regime["status"] != "NORMAL":
              max_alerts_this_run = 0
          else:
              max_alerts_this_run = 2

          if STATE_SAFE_MODE or PILOT["halted"]:
              max_alerts_this_run = 0

          for r in enter_signals:
              symbol = r["symbol"]

              if STATE_SAFE_MODE:
                  state_safe_blocks += 1
                  print(
                      "STATE SAFE BLOCK:",
                      symbol,
                      "alertas operacionais suspensos"
                  )
                  continue

              if PILOT["halted"]:
                  pilot_halt_blocks += 1
                  print(
                      "PILOT HALT BLOCK:",
                      symbol,
                      f"net={PILOT['net_r']:.2f}R",
                      f"stops={PILOT['consecutive_stops']}"
                  )
                  continue

              if len(PILOT["opened"]) + alerts_sent >= PILOT_MAX_OPEN:
                  open_cap_blocks += 1
                  print(
                      "OPEN CAP BLOCK:",
                      symbol,
                      f"limite {PILOT_MAX_OPEN}"
                  )
                  continue

              if btc_regime["status"] == "UNKNOWN":
                  btc_unknown_blocks += 1
                  print(
                      "BTC UNKNOWN BLOCK:",
                      symbol,
                      "sem validacao macro"
                  )
                  continue

              if btc_regime["caution"]:
                  btc_caution_blocks += 1
                  print(
                      "BTC CAUTION BLOCK:",
                      symbol,
                      "REAL PILOT exige BTC NORMAL"
                  )
                  continue

              if alerts_sent >= max_alerts_this_run:
                  alert_cap_blocks += 1
                  print(
                      "ALERT CAP BLOCK:",
                      symbol,
                      f"limite {max_alerts_this_run}/run"
                  )
                  continue

              last = int(STATE["alerts"].get(symbol, 0) or 0)
              open_trade = any(
                  t.get("symbol") == symbol and t.get("status") == "OPEN"
                  for t in STATE["trades"]
              )

              blocked_after_stop, reason = stop_block(symbol, now)
              if blocked_after_stop:
                  stop_blocks += 1
                  print("STOP BLOCK:", symbol, reason)
                  continue

              if open_trade or now - last < ALERT_COOLDOWN:
                  duplicates += 1
                  print("ALERT SUPPRESSED:", symbol)
                  continue

              age = int(r.get("signal_age_candles", 0))
              confirmation_text = (
                  "vela 15m mais recente"
                  if age == 0
                  else f"h\u00e1 {age} vela(s) 15m (~{age*15} min), ainda v\u00e1lida"
              )

              btc_context = (
                  f"{RED} RISK-OFF"
                  if btc_regime["risk_off"]
                  else (
                      f"{YELLOW} CAUTELA"
                      if btc_regime["caution"]
                      else f"{GREEN} NORMAL"
                  )
              )

              tv15 = (
                  f"https://www.tradingview.com/chart/"
                  f"?symbol=BINANCE%3A{symbol}&interval=15"
              )
              tv1h = (
                  f"https://www.tradingview.com/chart/"
                  f"?symbol=BINANCE%3A{symbol}&interval=60"
              )

              try:
                  quote = current_quote(symbol)
                  live_price = float(quote["ask"])
                  spread_pct = float(
                      quote["spread_pct"]
                  )
              except Exception as e:
                  live_price_blocks += 1
                  print(
                      "LIVE PRICE ERROR:",
                      symbol,
                      e
                  )
                  continue

              if spread_pct > MAX_SPREAD_PCT:
                  spread_blocks += 1
                  print(
                      "SPREAD BLOCK:",
                      symbol,
                      f"{spread_pct:.3f}%"
                  )
                  continue

              if not (
                  float(r["entry_low"])
                  <= live_price
                  <= float(r["entry_high"])
              ):
                  live_price_blocks += 1
                  direction = (
                      "acima"
                      if live_price > float(r["entry_high"])
                      else "abaixo"
                  )
                  print(
                      "LIVE PRICE BLOCK:",
                      symbol,
                      f"{live_price:.8g}",
                      direction,
                      "da zona"
                  )
                  continue

              risk_abs = max(
                  live_price - float(r["stop"]),
                  1e-12
              )
              reward_tp1_abs = max(
                  float(r["tp1"]) - live_price,
                  0.0
              )
              risk_pct = (
                  risk_abs / max(live_price, 1e-12)
              ) * 100
              reward_tp1_pct = (
                  reward_tp1_abs / max(live_price, 1e-12)
              ) * 100
              rr_tp1 = reward_tp1_abs / risk_abs

              if rr_tp1 < MIN_LIVE_RR_TP1:
                  rr_blocks += 1
                  print(
                      "LIVE RR BLOCK:",
                      symbol,
                      f"{rr_tp1:.2f}",
                      f"min={MIN_LIVE_RR_TP1:.2f}"
                  )
                  continue

              msg = (
                  f"{GREEN} REAL PILOT - ENTRAR\n"
                  f"{symbol}\n\n"
                  f"Market Cap Rank: #{r['rank']}\n"
                  f"Score t\u00e9cnico: {r['score']}/100\n"
                  f"Pre\u00e7o analisado: {r['price']:.8g}\n"
                  f"Ask executavel: {live_price:.8g}\n"
                  f"Spread: {spread_pct:.3f}%\n\n"
                  f"Zona de entrada: {r['entry_low']:.8g} - {r['entry_high']:.8g}\n"
                  f"Stop: {r['stop']:.8g}\n"
                  f"TP1: {r['tp1']:.8g}\n"
                  f"TP2: {r['tp2']:.8g}\n"
                  f"TP3: {r['tp3']:.8g}\n\n"
                  f"Risco ate Stop: -{risk_pct:.2f}%\n"
                  f"Potencial TP1: +{reward_tp1_pct:.2f}%\n"
                  f"R:R TP1: {rr_tp1:.2f} "
                  f"(min {MIN_LIVE_RR_TP1:.2f})\n\n"
                  f"RSI confirma\u00e7\u00e3o: {r['rsi']:.1f}\n"
                  f"Volume confirma\u00e7\u00e3o: {r['volume_ratio']:.2f}x media\n"
                  f"OB comprador: {r['ob_low']:.8g} - {r['ob_high']:.8g}\n"
                  f"Confirma\u00e7\u00e3o: {confirmation_text}\n"
                  f"Forca atual 15m: "
                  f"{CHECK if r.get('strength_retained', True) else WARNING} "
                  f"RSI {r.get('current_rsi', r['rsi']):.1f} | "
                  f"EMA20 {'OK' if r.get('current_above_ema20', True) else 'NAO'} | "
                  f"Vol {r.get('current_volume_ratio', 1.0):.2f}x\n"
                  f"Contexto BTC: {btc_context} "
                  f"({btc_regime['score']}/6 risco)\n"
                  f"Modo: {OPERATION_MODE} v{OPERATION_VERSION}\n"
                  f"Posicoes piloto abertas: "
                  f"{len(PILOT['opened']) + alerts_sent}/{PILOT_MAX_OPEN}\n"
                  f"PnL piloto fechado: {PILOT['net_r']:+.2f}R\n\n"
                  f"{CHECK} Tendencia 1H\n"
                  f"{CHECK} Order Block comprador\n"
                  f"{CHECK} Reteste + reclaim 15m\n"
                  f"{CHECK} Confirmacao de volume\n"
                  f"{CHECK} Retencao de forca 15m\n"
                  f"{CHECK} Follow-through confirmado\n"
                  f"{CHECK} Sem extensao excessiva\n\n"
                  f"{CHART} TradingView 15m:\n{tv15}\n"
                  f"{CHART} TradingView 1H:\n{tv1h}\n\n"
                  f"{WARNING} Confirmar o pre\u00e7o atual antes de executar.\n"
                  f"{WARNING} Nao entrar acima da zona indicada; respeitar o stop.\n"
                  f"{WARNING} Sinal tecnico; nao garante lucro."
              )

              # FIX1: ordem segura = Telegram -> bridge VPS -> grava estado.
              telegram_ok = telegram(msg)

              # Bridge independente: falhar aqui nunca altera Telegram,
              # cooldown, paper/shadow ou o fluxo principal do scanner.
              # O signal_id e estavel e permite deduplicacao no VPS.
              auto_ok = send_auto_signal(r, now)
              if auto_ok:
                  auto_delivery_ok += 1
              else:
                  auto_delivery_fail += 1

              if telegram_ok:
                  telegram_sent += 1
                  # So o sucesso do Telegram cria cooldown/shadow.
                  STATE["alerts"][symbol] = now
                  STATE["trades"].append({
                      "symbol":symbol,
                      "strategy_version":STRATEGY_VERSION,
                      "operation_version":OPERATION_VERSION,
                      "mode":OPERATION_MODE,
                      "opened_at":now,
                      "last_checked":now,
                      "status":"OPEN",
                      "entry":float(live_price),
                      "stop":float(r["stop"]),
                      "tp1":float(r["tp1"]),
                      "tp2":float(r["tp2"]),
                      "tp3":float(r["tp3"]),
                      "score":int(r["score"]),
                      "rank":int(r["rank"]),
                      "signal_age_candles":age,
                      "spread_pct":float(spread_pct),
                      "live_rr_tp1":float(rr_tp1),
                      "btc_score":int(btc_regime["score"]),
                      "telegram_delivered":bool(telegram_ok),
                      "auto_delivered":bool(auto_ok)
                  })
                  alerts_sent += 1

              time.sleep(1)

          closed = [t for t in STATE["trades"] if t.get("status") == "CLOSED"]
          opened = [t for t in STATE["trades"] if t.get("status") == "OPEN"]

          if MANUAL:
              top = results[:5]
              lines = [
                  f"{TEST} SCANNER EXECUTADO - v2.5.3 BRIDGE SAFE / REAL PILOT",
                  "",
                  "Top 200 analisado.",
                  f"Pares eleg\u00edveis: {len(candidates)}",
                  f"Sinais ENTRAR: {len(enter_signals)}",
                  f"Sinais operacionais: {alerts_sent}",
                  f"Telegram enviados: {telegram_sent}",
                  f"Auto-trader entregues: {auto_delivery_ok}",
                  f"Auto-trader falhas: {auto_delivery_fail}",
                  f"Duplicados bloqueados: {duplicates}",
                  f"Bloqueados p\u00f3s-stop: {stop_blocks}",
                  f"Bloqueados por BTC RISK-OFF: {btc_blocked}",
                  f"Bloqueados BTC UNKNOWN: {btc_unknown_blocks}",
                  f"Bloqueados BTC CAUTELA: {btc_caution_blocks}",
                  f"Bloqueados pre\u00e7o ao vivo: {live_price_blocks}",
                  f"Bloqueados spread: {spread_blocks}",
                  f"Bloqueados R:R ao vivo: {rr_blocks}",
                  f"Bloqueados limite/run: {alert_cap_blocks}",
                  f"Bloqueados limite posicoes: {open_cap_blocks}",
                  f"Bloqueados PILOT HALT: {pilot_halt_blocks}",
                  f"Bloqueados STATE SAFE: {state_safe_blocks}",
                  "",
                  (
                      f"Contexto BTC: {RED} RISK-OFF "
                      f"({btc_regime['score']}/6)"
                      if btc_regime["risk_off"]
                      else (
                          f"Contexto BTC: {YELLOW} CAUTELA "
                          f"({btc_regime['score']}/6)"
                          if btc_regime["caution"]
                          else
                          f"Contexto BTC: {GREEN} NORMAL "
                          f"({btc_regime['score']}/6)"
                      )
                  ),
                  "",
                  "Melhores scores:"
              ]

              for x in top:
                  age = x.get("signal_age_candles", 999)
                  age_txt = (
                      "agora"
                      if age == 0
                      else (
                          f"{age}x15m"
                          if age != 999
                          else "-"
                      )
                  )

                  score_x = int(
                      x.get("score", 0)
                      or 0
                  )

                  if x.get("status") == "ENTRAR":
                      light = GREEN
                      display_status = "ENTRAR"
                  elif score_x >= 70:
                      light = YELLOW
                      display_status = "AGUARDAR"
                  else:
                      light = RED
                      display_status = "EVITAR"

                  reason_tag = ""

                  if (
                      x.get("status") != "ENTRAR"
                      and x.get("signal_age_candles", 999)
                      in (1, 2, 3)
                      and not x.get(
                          "strength_retained",
                          True
                      )
                  ):
                      reason_tag = " [MOMENTUM]"

                  lines.append(
                      f"{light} {x['symbol']} - "
                      f"{score_x}/100 "
                      f"({display_status}) "
                      f"[{age_txt}]"
                      f"{reason_tag}"
                  )

              pilot_closed = PILOT["closed"]
              pilot_opened = PILOT["opened"]

              lines += [
                  "",
                  f"{GREEN} ENTRAR | {YELLOW} AGUARDAR | {RED} EVITAR",
                  "",
                  f"{CHART} REAL PILOT",
                  f"Abertos: {len(pilot_opened)}"
                  f"/{PILOT_MAX_OPEN}",
                  f"Fechados: {len(pilot_closed)}",
                  f"Net: {PILOT['net_r']:+.2f}R",
                  f"Stops consecutivos: "
                  f"{PILOT['consecutive_stops']}"
                  f"/{PILOT_MAX_CONSEC_STOPS}",
                  (
                      f"Estado: {RED} HALT"
                      if PILOT["halted"]
                      else f"Estado: {GREEN} ATIVO"
                  ),
                  "",
                  f"{CHART} PAPER TRADING TOTAL",
                  f"Abertos: {len(opened)}",
                  f"Fechados: {len(closed)}"
              ]

              if pilot_closed:
                  pilot_wins = sum(
                      1 for t in pilot_closed
                      if t.get("outcome") == "TP1"
                  )
                  pilot_wr = (
                      100 * pilot_wins / len(pilot_closed)
                  )
                  pilot_gp = sum(
                      max(float(t.get("pnl_r", 0)), 0)
                      for t in pilot_closed
                  )
                  pilot_gl = abs(sum(
                      min(float(t.get("pnl_r", 0)), 0)
                      for t in pilot_closed
                  ))
                  pilot_pf = (
                      pilot_gp / pilot_gl
                      if pilot_gl > 0
                      else float("inf")
                  )
                  lines += [
                      f"Pilot WR: {pilot_wr:.1f}%",
                      (
                          f"Pilot PF: {pilot_pf:.2f}"
                          if np.isfinite(pilot_pf)
                          else "Pilot PF: INF"
                      )
                  ]

              if closed:
                  wins = sum(1 for t in closed if t.get("outcome") == "TP1")
                  win_rate = 100 * wins / len(closed)

                  gp = sum(max(float(t.get("pnl_r",0)), 0) for t in closed)
                  gl = abs(sum(min(float(t.get("pnl_r",0)), 0) for t in closed))
                  pf = gp / gl if gl > 0 else float("inf")

                  lines += [
                      f"Win rate TP1/stop: {win_rate:.1f}%",
                      (
                          f"Profit factor: {pf:.2f}"
                          if np.isfinite(pf)
                          else "Profit factor: INF"
                      )
                  ]

              telegram("\n".join(lines))

          save_state()

          print("STATE:", len(STATE["trades"]), "paper trades")
          print("Paper fechados nesta execucao:", len(closed_now))
          print("Telegram enviados:", telegram_sent)
          print("Auto-trader entregues:", auto_delivery_ok)
          print("Auto-trader falhas:", auto_delivery_fail)
          print("Bloqueios pos-stop:", stop_blocks)
          print("Bloqueios BTC:", btc_blocked)
          print("Bloqueios BTC UNKNOWN:", btc_unknown_blocks)
          print("Bloqueios BTC CAUTELA:", btc_caution_blocks)
          print("Bloqueios preco ao vivo:", live_price_blocks)
          print("Bloqueios spread:", spread_blocks)
          print("Bloqueios R:R ao vivo:", rr_blocks)
          print("Bloqueios limite/run:", alert_cap_blocks)
          print("Bloqueios limite posicoes:", open_cap_blocks)
          print("Bloqueios PILOT HALT:", pilot_halt_blocks)
          print("Bloqueios STATE SAFE:", state_safe_blocks)
          print(
              "REAL PILOT:",
              f"open={len(PILOT['opened'])}",
              f"closed={len(PILOT['closed'])}",
              f"net={PILOT['net_r']:+.2f}R",
              f"stops={PILOT['consecutive_stops']}",
              f"halted={PILOT['halted']}"
          )
          print("SCAN TERMINADO")

          PY
